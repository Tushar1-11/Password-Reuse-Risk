services:
  - type: web
    name: password-reuse-risk-analyzer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE
        value: /var/data/password_risk.sqlite3
      - key: SECRET_FILE
        value: /var/data/fingerprint.key
    disk:
      name: password-risk-data
      mountPath: /var/data
      sizeGB: 1
